name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://qbghyeghcmraernvnxsn.supabase.co
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}

    steps:
      - name: Ping Supabase
        # -f: resposta HTTP de erro (4xx/5xx, como a do projeto pausado) faz o
        #     curl falhar, e com ele o job: o badge SupabaseAlive fica vermelho.
        #     Sem o -f, o curl terminava sem erro com qualquer resposta e o
        #     badge ficava verde mesmo com o Supabase fora do ar.
        # --retry: tenta de novo em falhas passageiras (timeout, 5xx, 429)
        # A chave vai no cabeçalho apikey (e não na URL, que aparece em logs)
        # e a consulta pede uma linha só, o mínimo para o banco "acordar".
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $SUPABASE_API_KEY" \
            "$SUPABASE_URL/rest/v1/guestbook_messages?select=id&limit=1" \
            -o /dev/null -w "Supabase respondeu HTTP %{http_code}\n"
