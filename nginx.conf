# Mesmo papel dos rewrites do vercel.json e do server.proxy do vite.config.js:
# WakaTime, komarev e views-counter não liberam CORS, então o navegador chama
# /api/... no próprio domínio e o Nginx repassa. Ao trocar de usuário, troque aqui também.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Os destinos são HTTPS e alguns (ex.: *.vercel.app) exigem SNI
    proxy_ssl_server_name on;

    # /api/wakatime/stats/all_time → wakatime.com/api/v1/users/aramuni/stats/all_time
    location /api/wakatime/ {
        proxy_pass https://wakatime.com/api/v1/users/aramuni/;
    }

    location = /api/github/profile-views {
        proxy_pass https://komarev.com/ghpvc/?username=joaopauloaramuni;
    }

    # A query (?pageId=...&type=total) segue como veio, sem recodificar
    location = /api/github/repo-views {
        proxy_pass https://views-counter.vercel.app/badge;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}