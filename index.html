<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: SVG nos navegadores atuais, .ico de reserva e ícone da tela de início do iOS -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>João Paulo Aramuni</title>
    <meta
      name="description"
      content="Professor de Engenharia de Software na PUC Minas e CTO da Agência Experimental de Software. Projetos, experiências e currículo em um terminal interativo."
    />
    <meta name="author" content="João Paulo Aramuni" />
    <!-- Links com ?cmd= e ?lang= apontam para a mesma página -->
    <link rel="canonical" href="https://aramuni.dev/" />

    <!-- Prévia do link (WhatsApp, LinkedIn, Slack, Telegram...) -->
    <!-- Os crawlers não rodam JavaScript: as tags precisam estar aqui, no HTML -->
    <!-- A imagem precisa de URL absoluta -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="aramuni.dev" />
    <meta property="og:url" content="https://aramuni.dev/" />
    <meta property="og:title" content="João Paulo Aramuni · Portfólio Terminal" />
    <meta
      property="og:description"
      content="Professor de Engenharia de Software na PUC Minas e CTO da Agência Experimental de Software. Projetos, experiências e currículo em um terminal interativo."
    />
    <meta property="og:image" content="https://aramuni.dev/portfolio1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="3340" />
    <meta property="og:image:height" content="1662" />
    <meta
      property="og:image:alt"
      content="Tela inicial do portfólio em estilo terminal, com nome, cargos e o prompt visitante@portfolio"
    />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- X/Twitter: imagem grande; título, descrição e imagem vêm das tags og: -->
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica o tema salvo antes do React carregar (evita piscar o dark)
      try {
        var saved = localStorage.getItem("aramuni-theme");
        if (saved === "light" || saved === "galo" || saved === "matrix") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
